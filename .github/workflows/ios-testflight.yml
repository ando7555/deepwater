name: iOS TestFlight upload
# Builds a signed Release build of the iOS app on a GitHub macOS runner and uploads it to App Store Connect,
# where it appears in TestFlight. No Mac is needed: Apple signing happens in the cloud with an
# App Store Connect API key. Run it by hand: Actions > iOS TestFlight upload > Run workflow.
#
# Repository secrets (Settings > Secrets and variables > Actions), see docs/ios/README.md:
#   APPLE_TEAM_ID    10-character Team ID (developer.apple.com > Account > Membership details)
#   ASC_KEY_ID       App Store Connect API key id
#   ASC_ISSUER_ID    App Store Connect API issuer id
#   ASC_KEY_P8       the whole text of the downloaded AuthKey_XXXX.p8 file
# Optional repository variable: IOS_BUNDLE_ID, if com.deepwater.app was taken.
on:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: ios-testflight, cancel-in-progress: false }
jobs:
  testflight:
    runs-on: macos-latest
    defaults: { run: { working-directory: frontend } }
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      # Optional repository variable, only if com.deepwater.app was already taken when registering the App ID.
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
    steps:
      - name: Check that the Apple secrets are set
        working-directory: .
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (see docs/ios/README.md)"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - run: npm ci
      - run: npm run ios:build
      - name: Write the API key where Xcode and altool look for it
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Archive (signed in the cloud by Apple)
        run: |
          set -o pipefail
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic ${IOS_BUNDLE_ID:+PRODUCT_BUNDLE_IDENTIFIER=$IOS_BUNDLE_ID} \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -60
      - name: Export the .ipa for App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
          ls -la "$RUNNER_TEMP/export"
      - name: Upload to App Store Connect (TestFlight)
        run: |
          xcrun altool --upload-app --type ios --file "$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove the API key
        if: always()
        run: rm -rf ~/.appstoreconnect
