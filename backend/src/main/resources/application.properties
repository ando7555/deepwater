server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8081}
management.endpoints.web.exposure.include=health
spring.application.name=deepwater
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/deepwater;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:${PGUSER:sa}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:}}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.graphql.graphiql.enabled=true
deepwater.teacher.email=${DEEPWATER_TEACHER_EMAIL:}
deepwater.google.client-id=${GOOGLE_CLIENT_ID:}
deepwater.google.client-secret=${GOOGLE_CLIENT_SECRET:}
deepwater.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/api/v1/auth/google/callback}
deepwater.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
deepwater.postmark.server-token=${POSTMARK_SERVER_TOKEN:}
deepwater.postmark.from=${MAIL_FROM:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Harbor live jobs from the public Arbeitnow job board API. Off by default; sample postings are always available.
deepwater.harbor.arbeitnow.enabled=${HARBOR_ARBEITNOW_ENABLED:false}
deepwater.harbor.arbeitnow.base-url=${HARBOR_ARBEITNOW_URL:https://www.arbeitnow.com/api/job-board-api}
# Polish B1 practice exam. The AI examiner runs only when ANTHROPIC_API_KEY is set; otherwise a fixed rubric marks writing and speaking.
deepwater.exam.anthropic-api-key=${ANTHROPIC_API_KEY:}
deepwater.exam.ai-model=${EXAM_AI_MODEL:claude-opus-5-5}
deepwater.exam.pass-percent=${EXAM_PASS_PERCENT:60}
