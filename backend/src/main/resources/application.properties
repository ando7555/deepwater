server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8081}
management.endpoints.web.exposure.include=health
spring.application.name=deepwater
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/deepwater;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:${PGUSER:sa}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:}}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.graphql.graphiql.enabled=true
deepwater.teacher.email=${DEEPWATER_TEACHER_EMAIL:}
deepwater.google.client-id=${GOOGLE_CLIENT_ID:}
deepwater.google.client-secret=${GOOGLE_CLIENT_SECRET:}
deepwater.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/api/v1/auth/google/callback}
deepwater.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
# Email. MAIL_PROVIDER: postmark (default), smtp (for example Proton Mail SMTP submission), or none.
deepwater.mail.provider=${MAIL_PROVIDER:postmark}
deepwater.mail.from=${MAIL_FROM:}
deepwater.postmark.server-token=${POSTMARK_SERVER_TOKEN:}
# SMTP defaults are Proton Mail's: user name = a custom-domain address, password = an SMTP token from Proton settings.
deepwater.smtp.host=${SMTP_HOST:smtp.protonmail.ch}
deepwater.smtp.port=${SMTP_PORT:587}
deepwater.smtp.username=${SMTP_USERNAME:}
deepwater.smtp.password=${SMTP_PASSWORD:}
deepwater.smtp.starttls=${SMTP_STARTTLS:true}
# Owner notifications. NOTIFY_CHANNEL: none (default) or signal. NOTIFY_EVENTS: signup, amber-report.
deepwater.notify.channel=${NOTIFY_CHANNEL:none}
deepwater.notify.events=${NOTIFY_EVENTS:signup,amber-report}
# Signal goes through a signal-cli-rest-api service you run yourself (unofficial; Signal has no bot API).
deepwater.signal.api-url=${SIGNAL_API_URL:}
deepwater.signal.sender=${SIGNAL_SENDER:}
deepwater.signal.recipients=${SIGNAL_RECIPIENTS:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Harbor live jobs from the public Arbeitnow job board API. Off by default; sample postings are always available.
deepwater.harbor.arbeitnow.enabled=${HARBOR_ARBEITNOW_ENABLED:false}
deepwater.harbor.arbeitnow.base-url=${HARBOR_ARBEITNOW_URL:https://www.arbeitnow.com/api/job-board-api}
# Real postings from employers' own public job boards (harbor/companies.json). On by default; refreshes every six hours.
deepwater.harbor.companies.enabled=${HARBOR_COMPANY_JOBS_ENABLED:true}
# Polish B1 practice exam. The AI examiner runs only when ANTHROPIC_API_KEY is set; otherwise a fixed rubric marks writing and speaking.
deepwater.exam.anthropic-api-key=${ANTHROPIC_API_KEY:}
deepwater.exam.ai-model=${EXAM_AI_MODEL:claude-opus-5-5}
deepwater.exam.pass-percent=${EXAM_PASS_PERCENT:60}
# "Ask Deepwater" assistant and MCP server. Everything here can be changed per environment without code.
# Provider: auto (Claude if ANTHROPIC_API_KEY is set, else off) | anthropic | ollama | off
deepwater.assistant.provider=${ASSISTANT_PROVIDER:auto}
deepwater.assistant.anthropic-api-key=${ANTHROPIC_API_KEY:}
deepwater.assistant.ai-model=${ASSISTANT_AI_MODEL:claude-opus-5-5}
deepwater.assistant.effort=${ASSISTANT_EFFORT:medium}
deepwater.assistant.timeout-seconds=${ASSISTANT_TIMEOUT_SECONDS:120}
# Local model on Ollama, e.g. after "ollama pull hermes3". Only reachable where Ollama runs (usually your own PC).
deepwater.assistant.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
deepwater.assistant.ollama.model=${OLLAMA_MODEL:hermes3}
deepwater.assistant.settings.max-steps=${ASSISTANT_MAX_STEPS:6}
deepwater.assistant.settings.max-history=${ASSISTANT_MAX_HISTORY:20}
deepwater.assistant.settings.max-message-chars=${ASSISTANT_MAX_MESSAGE_CHARS:2000}
deepwater.assistant.settings.runs-per-hour=${ASSISTANT_RUNS_PER_HOUR:30}
deepwater.assistant.settings.system-prompt=${ASSISTANT_SYSTEM_PROMPT:classpath:assistant/system-prompt.md}
deepwater.assistant.settings.suggestions=${ASSISTANT_SUGGESTIONS:Which cards should I review today?,Find jobs in Denmark that are open to me,Am I ready for Polish B1?}
# Tools offered to the assistant and over MCP (comma-separated names); empty = all.
deepwater.tools.enabled=${DEEPWATER_TOOLS_ENABLED:}
deepwater.mcp.server-version=${MCP_SERVER_VERSION:0.2.0}
